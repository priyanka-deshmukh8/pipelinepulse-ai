services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipelinepulse:pipelinepulse@db:5432/pipelinepulse
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipelinepulse
      POSTGRES_USER: pipelinepulse
      POSTGRES_PASSWORD: pipelinepulse
    ports:
      - "5432:5432"
    volumes:
      - pipelinepulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinepulse -d pipelinepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pipelinepulse_data:
